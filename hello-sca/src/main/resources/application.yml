server:
  port: 8082

spring:
  application:
    name: hello-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
  config:
    import:
      - nacos:hello-service.yaml?group=DEFAULT_GROUP&refreshEnabled=true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

demo:
  message: local-hello