server:
  port: 8081

spring:
  application:
    name: user-service
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # password: <若本地 redis 配置了 requirepass 则填写>
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/seata_user?createDatabaseIfNotExist=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8719
      eager: true
      datasource:
        flow-ds:
          nacos:
            server-addr: 127.0.0.1:8848
            dataId: user-service-sentinel-flow
            groupId: DEFAULT_GROUP
            rule-type: flow

feign:
  sentinel:
    enabled: true

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: order-producer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mybatis-plus:
  # 人工维护的 SQL 映射文件位置
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

app:
  points-cache:
    redis-ttl: 5m
    redis-ttl-jitter: 30s
    caffeine-ttl: 30s
    empty-ttl: 30s
    max-delta: 100000
    double-delete-delay: 500ms
  credits:
    max-delta: 100000

jetcache:
  statIntervalMinutes: 15
  areaInCacheName: false
  local:
    default:
      type: caffeine
      keyConvertor: jackson
      limit: 10000
      expireAfterWriteInMillis: 30000
  remote:
    default:
      type: redis.lettuce
      keyConvertor: jackson
      broadcastChannel: default
      valueEncoder: java
      valueDecoder: java
      uri: redis://127.0.0.1:6379/
      expireAfterWriteInMillis: 300000
