server:
  port: 8081
  tomcat:
    keep-alive-timeout: 120s
    max-keep-alive-requests: 10000
    max-connections: 20000
    accept-count: 1000
    threads:
      max: 400

spring:
  application:
    name: user-service
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # 统一 ShardingSphere 数据源后，Flyway 直连物理库执行 DDL（建 user_behavior_0~3 等），绕过逻辑表路由
    url: jdbc:mysql://127.0.0.1:3306/seata_user?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    user: root
    password: ""
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/user_profile
    redis:
      host: 127.0.0.1
      port: 6379
      # password: <若本地 redis 配置了 requirepass 则填写>
  datasource:
    # 统一 ShardingSphere 数据源：全部表走同一数据源，不分表的表由 shardingsphere.yaml 的 !SINGLE 规则穿透
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere.yaml
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8719
      eager: true
      datasource:
        flow-ds:
          nacos:
            server-addr: 127.0.0.1:8848
            dataId: user-service-sentinel-flow
            groupId: DEFAULT_GROUP
            rule-type: flow

feign:
  sentinel:
    enabled: true

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: order-producer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mybatis-plus:
  # 人工维护的 SQL 映射文件位置
  mapper-locations: classpath*:mapper/**/*.xml,classpath*:sharding-mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

app:
  points-cache:
    redis-ttl: 5m
    redis-ttl-jitter: 30s
    caffeine-ttl: 30s
    empty-ttl: 30s
    max-delta: 100000
    double-delete-delay: 500ms
  credits:
    max-delta: 100000

jetcache:
  statIntervalMinutes: 15
  areaInCacheName: false
  local:
    default:
      type: caffeine
      keyConvertor: jackson
      limit: 10000
      expireAfterWriteInMillis: 30000
  remote:
    default:
      type: redis.lettuce
      keyConvertor: jackson
      broadcastChannel: default
      valueEncoder: java
      valueDecoder: java
      uri: redis://127.0.0.1:6379/
      expireAfterWriteInMillis: 300000

# ---- 接口文档（SpringDoc + Knife4j） ----
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  setting:
    language: zh_cn
