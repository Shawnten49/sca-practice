server:
  port: 8083

spring:
  application:
    name: order-service
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    # Flyway 直连物理库执行 DDL（分片表 orders_0~3 由它创建），不走 ShardingSphere 逻辑表路由
    url: jdbc:mysql://127.0.0.1:3306/seata_order?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    user: root
    password: ""
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  # 双数据源（见 OrderDataSourceConfig）：
  #   dataSource       → shardingsphere.yaml（BASE），seataTransactionManager
  #   localDataSource  → shardingsphere-local.yaml（LOCAL），localTransactionManager
  # 事务注解约定（注解即显式）：
  #   @Transactional("seataTransactionManager") → Seata 全局事务（配 OrderMapper）
  #   @Transactional("localTransactionManager") → 本地事务，不走 Seata（配 LocalOrderMapper）
  # Mapper 按包绑定（见 OrderDataSourceConfig 的 @MapperScan）：
  #   com.example.order.mapper → BASE 数据源；com.example.order.dao → LOCAL 数据源
  # 新增本地 mapper：接口放 com.example.order.dao，XML 放 resources/mapper-local/ 即可自动注册
  # 不再使用 spring.datasource 自动装配，避免与两个数据源冲突。

seata:
  tx-service-group: seata_tx_group
  # 关键：禁止 Seata 把 ShardingSphereDataSource 包成 DataSourceProxy。
  # 否则 AT 模式会用 JDBC DatabaseMetaData 查逻辑表 orders 的元数据，
  # 而 ShardingSphere 元数据里只有 orders_0~3，导致 "Failed to fetch schema of orders"。
  # 分片库的全局事务改由 ShardingSphere 官方 Seata 集成管理（shardingsphere-transaction-base-seata-at）。
  enable-auto-data-source-proxy: false
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 127.0.0.1:8848
      group: DEFAULT_GROUP
      cluster: default
      username: nacos
      password: nacos
  service:
    vgroup-mapping:
      seata_tx_group: default

dubbo:
  application:
    # 与 spring.application.name 区分开，避免 Dubbo 应用级实例与 Spring Cloud 注册同名冲突
    name: order-service-dubbo
    qos-port: 22223
  registry:
    address: nacos://127.0.0.1:8848
  consumer:
    check: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: order-producer

leaf:
  mode: http            # http（默认，独立 Leaf 服务）| local（本地 SDK，leaf-core）
  url: http://127.0.0.1:8085
  connect-timeout: 2s
  read-timeout: 3s
  local:
    jdbc-url: jdbc:mysql://127.0.0.1:3306/leaf?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ""
    zk-address: 127.0.0.1:2181
    port: 8083

mybatis-plus:
  # 人工维护的 SQL 映射文件位置
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

# ---- 接口文档（SpringDoc + Knife4j） ----
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  setting:
    language: zh_cn
