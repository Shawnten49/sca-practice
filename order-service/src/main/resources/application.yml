server:
  port: 8083

spring:
  application:
    name: order-service
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/seata_order?createDatabaseIfNotExist=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

seata:
  tx-service-group: seata_tx_group
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 127.0.0.1:8848
      group: DEFAULT_GROUP
      cluster: default
      username: nacos
      password: nacos
  service:
    vgroup-mapping:
      seata_tx_group: default

dubbo:
  application:
    name: order-service
    qos-port: 22223
  registry:
    address: nacos://127.0.0.1:8848
  consumer:
    check: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: order-producer

leaf:
  mode: http            # http（默认，独立 Leaf 服务）| local（本地 SDK，leaf-core）
  url: http://127.0.0.1:8085
  connect-timeout: 2s
  read-timeout: 3s
  local:
    jdbc-url: jdbc:mysql://127.0.0.1:3306/leaf?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ""
    zk-address: 127.0.0.1:2181
    port: 8083

mybatis-plus:
  # 人工维护的 SQL 映射文件位置
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
