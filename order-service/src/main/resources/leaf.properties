# leaf-core 库必需：PropertyFactory/SnowflakeZookeeperHolder 启动时会从 classpath 读取本文件
leaf.name=com.sankuai.leaf.opensource.test

# 号段模式（本地 SDK 实际使用 LeafLocalConfig 的专用数据源，此处保持与 leaf-server 一致便于排查）
leaf.segment.enable=true
leaf.jdbc.url=jdbc:mysql://127.0.0.1:3306/leaf?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
leaf.jdbc.username=root
leaf.jdbc.password=

# 雪花模式（leaf.name 决定 ZK 路径 /snowflake/{leaf.name}/forever）
leaf.snowflake.enable=true
leaf.snowflake.zk.address=127.0.0.1:2181
leaf.snowflake.port=8083
